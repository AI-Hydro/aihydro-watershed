name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + all extras
        run: |
          python -m pip install --upgrade pip
          pip install import-linter
          pip install -e ".[all,dev]"

      - name: Lint with ruff (advisory — pre-existing debt, not yet a merge gate)
        continue-on-error: true
        run: ruff check aihydro_watershed tests

      - name: Layering guard (AST + import-linter)
        run: |
          pytest tests/test_layering.py -q
          lint-imports

      - name: Report NumPy / pysheds versions
        run: python -c "import numpy, pysheds; print('numpy', numpy.__version__, 'has in1d:', hasattr(numpy, 'in1d'))"

      - name: Exercise the np.in1d shim (NumPy lacking in1d)
        # CI resolves numpy 2.2.x on 3.10 (has in1d), 2.4.x on 3.11 and 2.5.x on
        # 3.12 (both lack it), so 3.11/3.12 run the shim path. Assert that, so a
        # future resolver change cannot silently stop covering it.
        if: matrix.python-version != '3.10'
        run: |
          python -c "import numpy; assert not hasattr(numpy, 'in1d'), numpy.__version__"
          pytest tests/test_numpy_compat.py tests/test_place_identity.py -q --tb=short

      - name: Run offline suite
        run: pytest -m "not live" -q --tb=short
